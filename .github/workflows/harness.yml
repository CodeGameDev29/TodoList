name: Harness
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "24.15.0" }
      - run: npm install -g @openai/codex@0.160.1
      - run: python scripts/harness/sync_agent_harness.py --check
      - run: python scripts/harness/quick_validate.py
      - run: python scripts/harness/validate_harness.py
      - run: python -m unittest discover -s tests
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24.15.0", cache: "npm" }
      - run: npm ci
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements-dev.txt
      - run: npm run format:check
      - run: npm test
      - run: npm run build
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24.15.0" }
      - run: docker compose config --quiet
      - run: docker build -t todolist:smoke .
      - run: node scripts/docker/smoke.mjs todolist:smoke
